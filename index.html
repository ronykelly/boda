<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rony Daniel & Kelly Gisselle — 18 Julio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf8f2;
    --warm: #f5ede0;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --brown: #6b4c2a;
    --text: #3a2e24;
    --text-light: #7a6a58;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ─── PANTALLA DEL SOBRE ─── */
  #envelope-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 60% 40%, #3d2408 0%, #1a0c04 50%, #080401 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 1s ease, visibility 1s ease;
    overflow: hidden;
  }
  #envelope-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 600px 400px at 20% 80%, rgba(201,169,110,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 80% 20%, rgba(201,169,110,0.05) 0%, transparent 70%);
    pointer-events: none;
  }
  #envelope-screen.hidden { opacity: 0; visibility: hidden; }

  /* Estrellas de fondo */
  .env-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .env-star {
    position: absolute;
    background: var(--gold-light);
    border-radius: 50%;
    animation: twinkle linear infinite;
  }

  .env-top-ornament {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(2rem, 5vw, 3.2rem);
    color: #f8f3ee;
    letter-spacing: 4px;
    margin-bottom: 4px;
    opacity: 0;
    animation: fadeUp 1s 0.2s forwards;
    text-shadow: 
      0 0 40px rgba(255,255,255,0.3),
      0 0 80px rgba(201,169,110,0.2),
      0 2px 4px rgba(0,0,0,0.4);
    line-height: 1.2;
  }

  .env-subtitle {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    letter-spacing: 6px;
    color: rgba(232,213,176,0.6);
    text-transform: uppercase;
    margin-bottom: 6px;
    opacity: 0;
    animation: fadeUp 1s 0.4s forwards;
  }

  #guest-name-display {
    font-family: 'Great Vibes', cursive;
    font-size: clamp(3.5rem, 9vw, 6rem);
    color: #f8f3ee;
    text-align: center;
    margin-bottom: 4px;
    opacity: 0;
    animation: fadeUp 1s 0.6s forwards;
    padding: 0 30px;
    text-shadow: 
      0 0 80px rgba(255,255,255,0.25),
      0 0 40px rgba(201,169,110,0.3),
      0 3px 6px rgba(0,0,0,0.5);
    line-height: 1.1;
  }

  .envelope-wrap {
    width: min(380px, 90vw);
    position: relative;
    opacity: 0;
    animation: fadeUp 1s 1s forwards;
    transition: transform 0.5s ease, opacity 0.8s ease;
  }
  .env-svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }
  #envFlap {
    transition: transform 0.9s cubic-bezier(0.4,0,0.2,1);
  }

  .env-hint {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(232,213,176,0.5);
    text-transform: uppercase;
    margin-top: 24px;
    opacity: 0;
    animation: fadeUp 1s 1.4s forwards, pulse 3s 2.5s infinite;
  }

  .open-btn {
    margin-top: 20px;
    background: transparent;
    border: 1px solid rgba(201,169,110,0.5);
    color: var(--gold-light);
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 16px 48px;
    cursor: pointer;
    transition: all 0.4s;
    opacity: 0;
    animation: fadeUp 1s 1.6s forwards;
    pointer-events: none; /* Se activa cuando carguen los datos */
    position: relative;
    overflow: hidden;
  }
  .open-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
    z-index: -1;
  }
  .open-btn:hover { color: #1a0c04; border-color: var(--gold); }
  .open-btn:hover::before { transform: scaleX(1); }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.3); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%,100% { opacity: 0.5; }
    50%      { opacity: 1; }
  }

  #main-page { display: none; }
  #main-page.visible { display: block; }
