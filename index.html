<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rony Daniel & Kelly Gisselle — 18 Julio 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #fdf8f2;
    --warm: #f5ede0;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --brown: #6b4c2a;
    --text: #3a2e24;
    --text-light: #7a6a58;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ─── PANTALLA DEL SOBRE ─── */
  #envelope-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 60% 40%, #3d2408 0%, #1a0c04 50%, #080401 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 1s ease, visibility 1s ease;
    overflow: hidden;
    padding: 20px;
  }
  #envelope-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 600px 400px at 20% 80%, rgba(201,169,110,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 80% 20%, rgba(201,169,110,0.05) 0%, transparent 70%);
    pointer-events: none;
  }
  #envelope-screen.hidden { opacity: 0; visibility: hidden; }

  .env-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .env-star {
    position: absolute;
    background: var(--gold-light);
    border-radius: 50%;
    animation: twinkle linear infinite;
  }

  .env-top-ornament {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    color: #f8f3ee;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 5px;
    opacity: 0;
    animation: fadeUp 1s 0.2s forwards;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    text-align: center;
  }

  /* NUEVO: Contenedor superior para pases/invitados en el Inicio */
  .env-guest-counter {
    font-family: 'Montserrat', sans-serif;
    font-size: clamp(10px, 2.5vw, 12px);
    font-weight: 500;
    letter-spacing: 3px;
    color: var(--gold-light);
    text-transform: uppercase;
    margin-bottom: 25px;
    opacity: 0;
    transition: opacity 0.5s ease;
    text-align: center;
    background: rgba(255, 255, 255, 0.05);
    padding: 6px 16px;
    border-radius: 15px;
    border: 1px solid rgba(201,169,110,0.2);
  }
  .env-guest-counter.visible { opacity: 1; }

  .envelope-wrap {
    width: min(380px, 90vw);
    position: relative;
    opacity: 0;
    animation: fadeUp 1s 0.6s forwards;
    transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease;
  }
  .env-svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }
  
  #envBody, #envFrontBody, #envFlap, #envSealGroup {
    transition: opacity 0.6s ease;
  }

  /* ─── CONTENEDOR EXCLUSIVO PARA LA POSTAL ─── */
  #postal-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: min(330px, 80vw);
    background: #fffdf8;
    padding: 12px 12px 18px 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.6);
    border-radius: 2px;
    opacity: 0;
    visibility: hidden;
    transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease, visibility 0.8s;
    z-index: 1005;
  }
  #postal-container.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -52%) scale(1);
  }
  .postal-frame {
    border: 1px solid #c9a96e;
    padding: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .postal-img {
    width: 100%;
    height: auto;
    aspect-ratio: 4 / 3;
    object-fit: cover;
    display: block;
    image-rendering: -webkit-optimize-contrast;
  }
  .postal-quote-text {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.3rem;
    font-style: italic;
    color: var(--text);
    margin-top: 14px;
    text-align: center;
  }

  /* Detalle abajo de la postal flotante */
  #postal-details {
    width: min(360px, 85vw);
    text-align: center;
    opacity: 0;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.8s ease, max-height 0.8s ease;
    z-index: 1010;
    margin-top: 10px;
  }
  #postal-details.show {
    opacity: 1;
    max-height: 100px;
  }
  .postal-curiosity {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 400;
    letter-spacing: 1.5px;
    color: var(--gold-light);
    text-transform: uppercase;
    background: rgba(44, 31, 16, 0.7);
    padding: 8px 16px;
    border-radius: 20px;
    display: inline-block;
    border: 1px solid rgba(201,169,110,0.3);
  }

  .env-hint {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    letter-spacing: 4px;
    color: rgba(232,213,176,0.5);
    text-transform: uppercase;
    margin-top: 24px;
    opacity: 0;
    animation: fadeUp 1s 1s forwards, pulse 3s 2.5s infinite;
  }

  .open-btn {
    margin-top: 25px;
    background: transparent;
    border: 1px solid rgba(201,169,110,0.5);
    color: var(--gold-light);
    font-family: 'Montserrat', sans-serif;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    padding: 16px 48px;
    cursor: pointer;
    transition: all 0.4s;
    opacity: 0;
    animation: fadeUp 1s 1.2s forwards;
    pointer-events: none;
    position: relative;
    overflow: hidden;
    z-index: 1020;
  }
  .open-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: scaleX(0);
    transform-origin: left;
    transition: transform 0.4s ease;
    z-index: -1;
  }
  .open-btn:hover { color: #1a0c04; border-color: var(--gold); }
  .open-btn:hover::before { transform: scaleX(1); }

  @media (max-width: 768px) {
    #postal-container { transform: translate(-50%, -50%) scale(0.85); width: min(310px, 85vw); }
    #postal-container.show { transform: translate(-50%, -55%) scale(1); }
  }

  /* ─── PÁGINA PRINCIPAL ─── */
  #main-page { display: none; }
  #main-page.visible { display: block; }

  .petals-bg {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .petal {
    position: absolute;
    width: 6px; height: 6px;
    background: var(--gold-light);
    border-radius: 50% 0 50% 0;
    opacity: 0;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.6; }
    90%  { opacity: 0.3; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
  }

  /* HERO */
  .hero {
    position: relative;
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1fr 1fr;
    overflow: hidden;
  }
  .hero-photo { position: relative; overflow: hidden; }
  .hero-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-photo::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to right, transparent 60%, var(--cream) 100%);
  }
  .hero-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 60px 60px 60px 40px;
    position: relative;
    background: var(--cream);
  }
  .ryk-monogram {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .hero-names {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.6rem, 6vw, 4.5rem);
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -1px;
    color: var(--text);
    margin-bottom: 24px;
  }
  .hero-names em {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 0.85em;
    color: var(--gold-dark);
  }
  .hero-tagline {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.25rem;
    font-style: italic;
    color: var(--text-light);
    margin-bottom: 40px;
    line-height: 1.7;
  }
  .divider-gold { width: 60px; height: 1px; background: var(--gold); margin: 24px 0; }

  /* TARJETAS DE EVENTO */
  .events-section { padding: 80px 40px; max-width: 900px; margin: 0 auto; position: relative; z-index: 1; }
  .section-label {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    font-size: 10px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 40px;
    text-align: center;
  }
  .events-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
  .event-card {
    background: var(--white);
    border: 1px solid var(--gold-light);
    padding: 44px 40px;
    position: relative;
    text-align: center;
    transition: transform 0.3s, box-shadow 0.3s;
  }
  .event-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 50px rgba(201,169,110,0.12);
  }
  .event-card::before {
    content: '';
    position: absolute;
    top: 8px; left: 8px; right: -8px; bottom: -8px;
    border: 1px solid var(--gold-light);
    z-index: -1;
    opacity: 0.5;
  }
  .event-icon { font-size: 2rem; margin-bottom: 16px; }
  .event-title { font-family: 'Playfair Display', serif; font-size: 2.2rem; font-weight: 400; color: var(--gold-dark); margin-bottom: 20px; }
  .event-detail { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; color: var(--text-light); line-height: 1.8; margin-bottom: 6px; }
  .event-place { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--text); font-weight: 400; margin: 12px 0 24px; line-height: 1.6; }
  .map-btn { display: inline-block; background: var(--gold); color: var(--white); font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; padding: 14px 32px; text-decoration: none; transition: background 0.3s; border: none; cursor: pointer; }
  .map-btn:hover { background: var(--gold-dark); }

  /* COUNTDOWN */
  .countdown-section { background: linear-gradient(160deg, #2c1f10, #1a0f06); padding: 80px 40px; text-align: center; position: relative; overflow: hidden; }
  .countdown-label { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 5px; text-transform: uppercase; color: var(--gold); margin-bottom: 40px; }
  .countdown-grid { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
  .count-item { text-align: center; }
  .count-num { font-family: 'Cormorant Garamond', serif; font-size: clamp(3rem, 8vw, 5rem); font-weight: 300; color: var(--white); line-height: 1; display: block; }
  .count-unit { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); display: block; margin-top: 8px; }
  .count-sep { font-size: 3rem; color: var(--gold); align-self: flex-start; padding-top: 10px; }

  /* FOTO PAREJA */
  .couple-photo-section { display: grid; grid-template-columns: 1fr 1fr; min-height: 60vh; }
  .couple-text { background: var(--warm); padding: 80px 60px; display: flex; flex-direction: column; justify-content: center; }
  .couple-text h2 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(2.2rem, 4vw, 3.5rem); color: var(--gold-dark); margin-bottom: 20px; }
  .couple-text p { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: var(--text-light); line-height: 1.9; }
  .couple-photo { overflow: hidden; }
  .couple-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.6s; }
  .couple-photo:hover img { transform: scale(1.03); }

  /* CONFIRMACIÓN RSVP */
  .rsvp-section { padding: 100px 40px; max-width: 680px; margin: 0 auto; text-align: center; position: relative; z-index: 1; }
  .rsvp-title { font-family: 'Playfair Display', serif; font-weight: 400; font-size: clamp(2.2rem, 5vw, 3.8rem); color: var(--text); margin-bottom: 12px; }
  .rsvp-sub { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; color: var(--gold); margin-bottom: 16px; }
  .rsvp-msg { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: var(--text-light); margin-bottom: 50px; line-height: 1.8; }
  
  .rsvp-guest-info { background: var(--warm); border: 1px solid var(--gold-light); padding: 24px 32px; margin-bottom: 40px; text-align: left; }
  .rsvp-guest-info p { font-family: 'Cormorant Garamond', serif; font-size: 1.1rem; color: var(--text-light); margin-bottom: 4px; }
  .rsvp-guest-info strong { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 1.8rem; color: var(--text); display: block; margin-bottom: 4px; }
  .rsvp-guest-info span { font-family: 'Montserrat', sans-serif; font-weight: 500; font-size: 11px; color: var(--gold); letter-spacing: 2px; text-transform: uppercase; }

  .rsvp-buttons { display: flex; gap: 20px; justify-content: center; flex-wrap: wrap; }
  .rsvp-btn { padding: 18px 50px; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 11px; letter-spacing: 4px; text-transform: uppercase; border: none; cursor: pointer; transition: all 0.3s; position: relative; overflow: hidden; }
  .rsvp-btn-yes { background: var(--gold); color: var(--white); }
  .rsvp-btn-yes:hover { background: var(--gold-dark); transform: translateY(-2px); }
  .rsvp-btn-no { background: transparent; color: var(--text-light); border: 1px solid #ccc; }
  .rsvp-btn-no:hover { border-color: var(--text-light); color: var(--text); transform: translateY(-2px); }

  .rsvp-response { display: none; padding: 40px; background: var(--warm); border: 1px solid var(--gold-light); margin-top: 30px; }
  .rsvp-response.show { display: block; }
  .rsvp-response h3 { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 2.4rem; color: var(--gold-dark); margin-bottom: 10px; }
  .rsvp-response p { font-family: 'Cormorant Garamond', serif; font-size: 1.15rem; color: var(--text-light); font-style: italic; }

  /* HISTORIA */
  .story-section { padding: 80px 40px; max-width: 760px; margin: 0 auto; }
  .story-timeline { position: relative; padding-left: 40px; }
  .story-timeline::before { content: ''; position: absolute; left: 8px; top: 0; bottom: 0; width: 1px; background: var(--gold-light); }
  .story-item { position: relative; margin-bottom: 50px; display: flex; gap: 30px; align-items: flex-start; }
  .story-dot { position: absolute; left: -36px; top: 6px; width: 14px; height: 14px; background: var(--gold); border-radius: 50%; border: 3px solid var(--cream); box-shadow: 0 0 0 1px var(--gold); flex-shrink: 0; }
  .story-content { flex: 1; }
  .story-year { font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); display: block; margin-bottom: 10px; }
  .story-text { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-style: italic; color: var(--text-light); line-height: 1.9; }

  /* GALERÍA */
  .gallery-section { padding: 60px 40px 80px; max-width: 960px; margin: 0 auto; }
  .gallery-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .gallery-item { aspect-ratio: 1; overflow: hidden; position: relative; }
  .gallery-placeholder { width: 100%; height: 100%; background: var(--warm); border: 2px dashed var(--gold-light); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: var(--text-light); font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 2px; min-height: 160px; }
  .gallery-placeholder span { font-size: 2rem; }

  /* FOOTER */
  footer { background: #1a0f06; text-align: center; padding: 50px 20px; }
  footer .footer-names { font-family: 'Playfair Display', serif; font-weight: 400; font-size: 2.2rem; color: var(--gold-light); margin-bottom: 12px; }
  footer p { font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 3px; color: rgba(255,255,255,0.3); text-transform: uppercase; }

  .music-btn { position: fixed; bottom: 30px; right: 30px; width: 48px; height: 48px; background: var(--gold); border-radius: 50%; border: none; cursor: pointer; display: none; align-items: center; justify-content: center; z-index: 500; box-shadow: 0 4px 20px rgba(201,169,110,0.4); transition: transform 0.3s; font-size: 18px; }
  .music-btn:hover { transform: scale(1.1); }
  .music-btn.visible { display: flex; }

  .reveal { opacity: 0; transform: translateY(30px); transition: opacity 0.8s, transform 0.8s; }
  .reveal.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    .hero { grid-template-columns: 1fr; }
    .events-grid { grid-template-columns: 1fr; }
    .couple-photo-section { grid-template-columns: 1fr; }
    .gallery-grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<div id="envelope-screen">
  <div class="env-stars" id="envStars"></div>
  <div class="env-top-ornament">Rony Daniel & Kelly Gisselle</div>
  
  <div class="env-guest-counter" id="envGuestCounter">Cantidad de invitados: --</div>
  
  <div class="envelope-wrap" id="envelopeWrap">
    <svg class="env-svg" id="envSVG" viewBox="0 0 400 320" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#f0ddb8"/><stop offset="50%" style="stop-color:#d4a85a"/><stop offset="100%" style="stop-color:#b8863a"/>
        </linearGradient>
        <linearGradient id="flapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#e8c87a"/><stop offset="100%" style="stop-color:#c9935a"/>
        </linearGradient>
        <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#8b5e1a"/><stop offset="100%" style="stop-color:#5c3a0a"/>
        </linearGradient>
        <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="rgba(0,0,0,0.5)"/></filter>
        <filter id="glow"><feGaussianBlur stdDeviation="3" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>

      <g id="envBodyStructure">
        <rect id="envBody" x="20" y="110" width="360" height="180" rx="6" fill="url(#bodyGrad)" filter="url(#shadow)"/>
        <path id="envFrontBody" d="M20,110 L200,220 L380,110 L380,290 L20,290 Z" fill="url(#bodyGrad)"/>
        <polygon points="20,110 200,220 380,110" fill="rgba(160,100,40,0.15)"/>
        <polygon points="20,290 200,190 20,110" fill="rgba(120,70,20,0.2)"/>
        <polygon points="380,290 200,190 380,110" fill="rgba(120,70,20,0.2)"/>
        <polygon points="20,290 200,190 380,290" fill="rgba(100,60,15,0.25)"/>
        <rect x="20" y="110" width="360" height="180" rx="6" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
      </g>

      <g id="envFlap" style="transform-origin: 200px 110px; transform-box: fill-box;">
        <polygon points="20,110 200,225 380,110" fill="url(#flapGrad)"/>
      </g>

      <g id="envSealGroup">
        <circle id="envSealCircle" cx="200" cy="200" r="32" fill="url(#sealGrad)" filter="url(#glow)"/>
        <circle cx="200" cy="200" r="32" fill="none" stroke="#c9a96e" stroke-width="1.5"/>
        <text id="envSealText" x="200" y="204" text-anchor="middle" font-family="'Montserrat', sans-serif" font-weight="300" font-size="14" fill="#e8d5b0" letter-spacing="2">R & K</text>
      </g>
    </svg>
  </div>

  <div id="postal-container">
    <div class="postal-frame">
      <img src="declaracion.jpeg" alt="Propuesta Tikal" class="postal-img">
      <p class="postal-quote-text">"Nuestra mayor aventura comienza aquí..."</p>
    </div>
  </div>

  <div id="postal-details">
    <p class="postal-curiosity">💡 Dato curioso: ¡Rony le propuso matrimonio a Kelly exactamente en ese punto de Tikal!</p>
  </div>

  <p class="env-hint" id="envHint">✦   Tu invitación te espera   ✦</p>
  <button class="open-btn" id="openBtn">✦   Abrir Invitación   ✦</button>
</div>

<button class="music-btn" id="musicBtn" onclick="toggleMusic()">♪</button>

<div id="main-page">
  <div class="petals-bg" id="petals"></div>
