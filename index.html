<style>
  :root {
    --cream: #fdf8f2;
    --warm: #f5ede0;
    --gold: #c9a96e;
    --gold-light: #e8d5b0;
    --gold-dark: #a07840;
    --brown: #6b4c2a;
    --text: #3a2e24;
    --text-light: #7a6a58;
    --white: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    font-family: 'Cormorant Garamond', serif;
    color: var(--text);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }

  /* ─── PANTALLA DEL SOBRE ─── */
  #envelope-screen {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 60% 40%, #3d2408 0%, #1a0c04 50%, #080401 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    transition: opacity 1s ease, visibility 1s ease;
    overflow: hidden;
    padding: 20px;
  }
  #envelope-screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: 
      radial-gradient(ellipse 600px 400px at 20% 80%, rgba(201,169,110,0.06) 0%, transparent 70%),
      radial-gradient(ellipse 400px 300px at 80% 20%, rgba(201,169,110,0.05) 0%, transparent 70%);
    pointer-events: none;
  }
  #envelope-screen.hidden { opacity: 0; visibility: hidden; }

  .env-stars {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .env-star {
    position: absolute;
    background: var(--gold-light);
    border-radius: 50%;
    animation: twinkle linear infinite;
  }

  .env-top-ornament {
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    font-size: clamp(1.1rem, 3.5vw, 1.6rem);
    color: #f8f3ee;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 20px;
    opacity: 0;
    animation: fadeUp 1s 0.2s forwards;
    text-shadow: 0 2px 4px rgba(0,0,0,0.4);
    text-align: center;
  }

  /* BLOQUE: Datos del Invitado en la bienvenida */
  #env-guest-block {
    text-align: center;
    margin-bottom: 25px;
    opacity: 0;
    transition: opacity 0.5s ease;
  }
  #env-guest-block.visible { opacity: 1; }
  
  .env-guest-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.2rem;
    font-style: italic;
    color: var(--gold-light);
    margin-bottom: 4px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }
  .env-guest-name {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.6rem, 4.5vw, 2.4rem);
    font-weight: 400;
    color: #ffffff;
    margin-bottom: 12px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.6);
  }
  .env-guest-counter {
    font-family: 'Montserrat', sans-serif;
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 2.5px;
    color: var(--gold-light);
    text-transform: uppercase;
    background: rgba(255, 255, 255, 0.06);
    padding: 6px 14px;
    border-radius: 15px;
    border: 1px solid rgba(201,169,110,0.2);
    display: inline-block;
  }

  .envelope-wrap {
    width: min(380px, 90vw);
    position: relative;
    opacity: 0;
    animation: fadeUp 1s 0.6s forwards;
    transition: transform 0.5s ease, opacity 0.5s ease;
  }
  .env-svg {
    width: 100%;
    height: auto;
    overflow: visible;
  }
  
  #envBody, #envFrontBody, #envFlap, #envSealGroup {
    transition: opacity 0.5s ease;
  }

  /* ─── CONTENEDOR EXCLUSIVO PARA LA POSTAL POLAROID FLOTANTE ─── */
  #postal-container {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    width: min(340px, 85vw);
    background: #fffdf8;
    padding: 12px 12px 18px 12px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.7);
    border-radius: 2px;
    opacity: 0;
    visibility: hidden;
    transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.8s ease, visibility 0.8s;
    z-index: 1005;
  }
  #postal-container.show {
    opacity: 1;
    visibility: visible;
    transform: translate(-50%, -52%) scale(1);
  }
